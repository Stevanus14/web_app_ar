
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Tumbler Recognition</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* Kotak informasi bagian atas */
    #info {
      position: fixed;
      top: 15px;
      left: 5%;
      width: 90%;
      padding: 16px;
      background: white;
      border-radius: 14px;
      z-index: 10;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    #info h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #222;
    }

    #info p {
      margin: 0;
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    /* Tombol pilihan target */
    #controls {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      background: white;
      color: #222;
      font-weight: bold;
      font-size: 14px;
    }

    button.active {
      background: #2563eb;
      color: white;
    }

    #status {
      position: fixed;
      bottom: 85px;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 20;
      font-size: 13px;
      text-shadow: 0 1px 4px black;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      background: #111;
      z-index: 100;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <p>Memuat WebAR...</p>
  </div>

  <div id="info">
    <h2 id="infoTitle">Tumbler</h2>
    <p id="infoDescription"></p>
  </div>

  <div id="status">Pilih gambar yang ingin dikenali</div>

  <div id="controls">
    <button id="btn1" class="active" onclick="startTracking(1)">
      Tumbler Lantai
    </button>

    <button id="btn2" onclick="startTracking(2)">
      Tumbler Meja
    </button>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: asset/tumbler.mind; autoStart: false;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target1" mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("#scene");
    const info = document.querySelector("#info");
    const title = document.querySelector("#infoTitle");
    const description = document.querySelector("#infoDescription");
    const status = document.querySelector("#status");
    const loading = document.querySelector("#loading");

    let currentTarget = 1;
    let started = false;

    async function startTracking(target) {

      currentTarget = target;

      info.style.display = "none";
      loading.style.display = "flex";

      status.innerText = "Menyiapkan kamera...";

      document.querySelector("#btn1").classList.toggle("active", target === 1);
      document.querySelector("#btn2").classList.toggle("active", target === 2);

      // Hentikan instance sebelumnya
      if (started) {
        try {
          await scene.systems["mindar-image-system"].stop();
        } catch (error) {
          console.log(error);
        }
        started = false;
      }

      // Ganti sumber target
      const mindar = scene.getAttribute("mindar-image");

      mindar.imageTargetSrc =
        target === 1
          ? "asset/tumbler.mind"
          : "asset/tumbler2.mind";

      scene.setAttribute("mindar-image", mindar);

      // Ganti entity target
      const oldTarget = document.querySelector("#target1");

      if (oldTarget) {
        oldTarget.remove();
      }

      const newTarget = document.createElement("a-entity");
      newTarget.setAttribute("mindar-image-target", "targetIndex: 0");
      newTarget.id = "target1";
      scene.appendChild(newTarget);

      newTarget.addEventListener("targetFound", () => {

        if (currentTarget === 1) {
          title.innerText = "Tumbler 1 - Lantai";
          description.innerText =
            "Kamera berhasil mengenali tumbler yang berada di lantai.";
        } else {
          title.innerText = "Tumbler 2 - Meja";
          description.innerText =
            "Kamera berhasil mengenali tumbler yang berada di meja.";
        }

        info.style.display = "block";
        status.innerText = "Gambar berhasil dikenali!";
      });

      newTarget.addEventListener("targetLost", () => {
        info.style.display = "none";
        status.innerText = "Arahkan kamera ke gambar tumbler.";
      });

      try {
        await scene.systems["mindar-image-system"].start();

        started = true;
        loading.style.display = "none";

        status.innerText = "Arahkan kamera ke gambar tumbler.";

      } catch (error) {
        console.error(error);
        loading.innerHTML =
          "<p>Gagal membuka kamera. Pastikan izin kamera diberikan dan website menggunakan HTTPS.</p>";
      }
    }

    window.addEventListener("load", () => {
      loading.style.display = "none";
      status.innerText = "Tekan salah satu tombol untuk memulai.";
    });

  </script>

</body>
</html>
