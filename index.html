
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebAR - Tumbler Recognition</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      color: white;
      background: #111827;
    }

    #startButton {
      margin-top: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton:disabled {
      opacity: 0.6;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 13px;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    #status.found {
      background: #15803d;
    }

    #errorMessage {
      color: #fca5a5;
      margin-top: 15px;
      font-size: 14px;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <!-- Halaman awal -->
  <div id="startScreen">
    <h1>WebAR Tumbler</h1>

    <p>
      Arahkan kamera ke foto tumbler
      untuk mengenali objek.
    </p>

    <button id="startButton">
      Mulai AR
    </button>

    <div id="errorMessage"></div>
  </div>

  <!-- Status deteksi -->
  <div id="status">
    Kamera belum diaktifkan
  </div>

  <!-- AR Scene -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/tumbler.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <!-- Kamera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- Target gambar tumbler -->
    <a-entity
      id="tumblerTarget"
      mindar-image-target="targetIndex: 0"
    >

      <!-- Background teks -->
      <a-plane
        position="0 0.35 0.02"
        width="1.15"
        height="0.32"
        color="#111827"
        opacity="0.9"
      ></a-plane>

      <!-- Teks utama -->
      <a-text
        value="Ini adalah Tumbler!"
        position="0 0.35 0.04"
        align="center"
        color="#FFFFFF"
        width="2.5"
        scale="0.5 0.5 0.5"
      ></a-text>

      <!-- Teks tambahan -->
      <a-text
        value="Objek berhasil dikenali"
        position="0 0.20 0.04"
        align="center"
        color="#FFFFFF"
        width="2"
        scale="0.35 0.35 0.35"
      ></a-text>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#tumblerTarget");

    const startScreen = document.querySelector("#startScreen");
    const startButton = document.querySelector("#startButton");
    const status = document.querySelector("#status");
    const errorMessage = document.querySelector("#errorMessage");

    let arStarted = false;

    // Menunggu A-Frame selesai memuat scene
    scene.addEventListener("loaded", () => {
      startButton.disabled = false;
    });

    // Memulai kamera setelah tombol ditekan
    startButton.addEventListener("click", async () => {

      if (arStarted) return;

      startButton.disabled = true;
      startButton.textContent = "Mengaktifkan kamera...";
      errorMessage.textContent = "";
      status.textContent = "Mengaktifkan kamera...";

      try {
        const arSystem = scene.systems["mindar-image-system"];

        await arSystem.start();

        arStarted = true;

        startScreen.style.display = "none";
        status.textContent = "Arahkan kamera ke foto tumbler";

      } catch (error) {

        console.error("AR Error:", error);

        status.textContent = "Kamera gagal diaktifkan";

        errorMessage.textContent =
          "Pastikan akses kamera diizinkan dan halaman dibuka melalui HTTPS.";

        startButton.disabled = false;
        startButton.textContent = "Coba Lagi";
      }
    });

    // Ketika gambar tumbler terdeteksi
    target.addEventListener("targetFound", () => {

      status.textContent = "Tumbler berhasil dikenali!";
      status.classList.add("found");

    });

    // Ketika gambar tumbler tidak lagi terlihat
    target.addEventListener("targetLost", () => {

      status.textContent = "Mencari gambar tumbler...";
      status.classList.remove("found");

    });
  </script>

</body>
</html>
